name: CI

# Typecheck, build the static site and run the browser tests on every push
# and pull request. A red cross on GitHub means something broke.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # product / price / settings updates from the owner page are content, not code: no test run
    if: ${{ !startsWith(github.event.head_commit.message, 'Owner:') }}
    runs-on: ubuntu-latest
    # Playwright's own image: the browser and everything it needs are already
    # installed (installing them took over 10 minutes per run)
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npm test
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
